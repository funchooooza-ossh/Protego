version: "3.8"

services:
  db:
    image: postgres:15
    container_name: protego-db
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "protego_user", "-d", "protego" ]
      interval: 3s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    container_name: protego-redis
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  protego:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - ./.env
    ports:
      - "8080:8080"

volumes:
  pg_data:
  redis_data:
